<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>리센느의 백제어택</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #0a0a12; font-family: 'Malgun Gothic', sans-serif;
    color: #eee; user-select: none;
  }
  #gameCanvas { display: block; background: #14141f; }
  #ui {
    position: fixed; top: 0; left: 0; width: 100%;
    padding: 10px; box-sizing: border-box;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  #hpBarWrap, #xpBarWrap {
    background: #222; border: 2px solid #555; border-radius: 6px;
    height: 18px; overflow: hidden;
  }
  #hpBarWrap { width: 220px; }
  #xpBarWrap { width: 100%; margin-top: 4px; height: 10px; }
  #hpBar { background: linear-gradient(#e33, #a11); height: 100%; width: 100%; transition: width .2s; }
  #xpBar { background: linear-gradient(#3cf, #06a); height: 100%; width: 0%; transition: width .2s; }
  #topLeft { pointer-events: none; }
  #topRight { text-align: right; font-size: 14px; }
  #levelText { font-size: 16px; font-weight: bold; margin-bottom: 2px; }
  #bottomBar {
    position: fixed; bottom: 0; left: 0; width: 100%;
    text-align: center; padding: 6px; font-size: 12px; color: #999;
    pointer-events: none;
  }
  #levelUpModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 20;
    padding: 16px; box-sizing: border-box;
  }
  #levelUpModal h2 { margin-bottom: 20px; color: #ffd54f; font-size: 22px; }
  .cardRow { display: flex; gap: 16px; }
  .card {
    background: #1e1e2e; border: 2px solid #444; border-radius: 10px;
    width: 160px; padding: 16px; cursor: pointer; text-align: center;
    transition: transform .1s, border-color .1s;
  }
  .card:hover { transform: scale(1.05); border-color: #ffd54f; }
  .card.selected { transform: scale(1.07); border-color: #ffd54f; box-shadow: 0 0 16px rgba(255,213,79,0.6); }
  .card .icon { font-size: 32px; margin-bottom: 8px; }
  .card .name { font-weight: bold; margin-bottom: 6px; }
  .card .desc { font-size: 12px; color: #aaa; }

  /* 세로형 스마트폰 대응: 카드를 세로로 쌓고 글자 크게 */
  @media (max-width: 600px) {
    #levelUpModal h2 { font-size: 24px; margin-bottom: 10px; }
    #levelUpModal p { font-size: 15px !important; }
    .cardRow { flex-direction: column; width: 100%; max-width: 420px; gap: 14px; }
    .card {
      width: 100%; box-sizing: border-box;
      display: flex; align-items: center; text-align: left;
      gap: 18px; padding: 20px 20px;
      border-width: 3px;
    }
    .card .icon { font-size: 46px; margin-bottom: 0; flex-shrink: 0; }
    .card .name { font-size: 20px; margin-bottom: 6px; }
    .card .desc { font-size: 16px; line-height: 1.45; }
    .card .textWrap { display: flex; flex-direction: column; }
  }
  #gameOverModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 30;
  }
  #gameOverModal h1 { color: #e33; }
  #restartBtn {
    margin-top: 16px; padding: 10px 24px; font-size: 16px;
    background: #ffd54f; border: none; border-radius: 6px; cursor: pointer;
    font-weight: bold;
  }
  #startModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; z-index: 40; text-align: center;
  }
  #startModal h1 { color: #ffd54f; margin-bottom: 8px; }
  #startModal p { color: #aaa; max-width: 400px; line-height: 1.6; }
  #startBtn {
    margin-top: 20px; padding: 12px 32px; font-size: 18px;
    background: #ffd54f; border: none; border-radius: 6px; cursor: pointer;
    font-weight: bold;
  }
  #viewLeaderboardBtn {
    margin-top: 10px; padding: 8px 22px; font-size: 14px;
    background: transparent; border: 1px solid #ffd54f; color: #ffd54f;
    border-radius: 6px; cursor: pointer;
  }
  #startLeaderboardModal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 45; text-align: center;
  }
  #startLeaderboardModal h2 { color: #ffd54f; margin-bottom: 12px; }
  #startLeaderboardList {
    list-style: none; padding: 0; margin: 0; width: 90%; max-width: 340px;
    max-height: 320px; overflow-y: auto;
    background: #1a1a26; border-radius: 8px; border: 1px solid #333;
  }
  #startLeaderboardList li {
    display: flex; justify-content: space-between; padding: 6px 12px;
    font-size: 13px; border-bottom: 1px solid #262636; color: #eee;
  }
  #startLeaderboardList .rank { width: 28px; color: #999; }
  #closeLeaderboardBtn {
    margin-top: 16px; padding: 8px 24px; font-size: 14px;
    background: #ffd54f; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
  }
  /* 모바일 가상 조이스틱 (터치한 지점에서 바로 생성되는 방식) */
  #touchZone {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    z-index: 12; touch-action: none; display: none;
  }
  #joystickBase {
    position: fixed; width: 55px; height: 55px;
    border-radius: 50%; background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    touch-action: none; z-index: 15; display: none;
    transform: translate(-50%, -50%);
  }
  #joystickKnob {
    position: absolute; left: 27px; top: 27px; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(255,255,255,0.45);
    border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  /* 리더보드 */
  #leaderboardWrap { display: none; width: 90%; max-width: 340px; margin-top: 10px; }
  /* BGM/효과음 토글 버튼 */
  #audioControls {
    position: fixed; top: 58px; right: 10px; z-index: 16;
    display: flex; gap: 6px; pointer-events: auto;
  }
  #audioControls button {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.9;
  }
  #audioControls button.muted { opacity: 0.4; }
  /* 유튜브 BGM 플레이어 (상단 에너지바 바로 아래, 중앙에 작게) */
  #ytPlayerWrap {
    position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
    width: 160px; height: 90px; z-index: 14;
    border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    background: rgba(20,16,10,0.55);
    pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
  }
  #ytPlayerWrap::before {
    content: '♪ BGM 로딩중...';
    position: absolute; color: rgba(255,255,255,0.5); font-size: 11px;
    pointer-events: none;
  }
  #ytPlayerWrap.yt-hidden { display: none; }
  #ytPlayerWrap.yt-active { background: transparent; }
  #ytPlayerWrap.yt-active::before { content: none; }
  #leaderboardWrap h3 { color: #ffd54f; text-align: center; margin-bottom: 8px; }
  #leaderboardList {
    list-style: none; padding: 0; margin: 0;
    max-height: 260px; overflow-y: auto;
    background: #1a1a26; border-radius: 8px; border: 1px solid #333;
  }
  #leaderboardList li {
    display: flex; justify-content: space-between; padding: 6px 12px;
    font-size: 13px; border-bottom: 1px solid #262636;
  }
  #leaderboardList li.me { background: rgba(255,213,79,0.15); color: #ffd54f; font-weight: bold; }
  #leaderboardList .rank { width: 28px; color: #999; }
  #nicknameEntry { display: flex; flex-direction: column; align-items: center; margin-top: 14px; }
  #nicknameInput {
    padding: 8px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #555;
    background: #1a1a26; color: #eee; text-align: center; width: 180px; margin-bottom: 8px;
  }
  #submitScoreBtn {
    padding: 8px 20px; font-size: 14px; background: #ffd54f; border: none;
    border-radius: 6px; cursor: pointer; font-weight: bold;
  }
  #playAgainBtn {
    margin-top: 14px; padding: 10px 24px; font-size: 16px;
    background: #ffd54f; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="touchZone"></div>
<div id="joystickBase"><div id="joystickKnob"></div></div>
<div id="audioControls">
  <button id="bgmToggleBtn" title="배경음악 켬/끔">🎵</button>
  <button id="sfxToggleBtn" title="효과음 켬/끔">🔊</button>
</div>
<div id="ytPlayerWrap"><div id="ytPlayer"></div></div>


<div id="ui">
  <div id="topLeft">
    <div id="hpBarWrap"><div id="hpBar"></div></div>
  </div>
  <div id="topRight">
    <div id="levelText">Lv.1</div>
    <div>⏱ <span id="timeText">00:00</span></div>
    <div>💀 <span id="killText">0</span></div>
  </div>
</div>
<div style="position:fixed; top:36px; left:10px; width:calc(100% - 20px);">
  <div id="xpBarWrap"><div id="xpBar"></div></div>
</div>

<div id="bottomBar">WASD / 방향키로 이동 — 공격은 자동입니다</div>

<div id="levelUpModal">
  <h2>레벨 업! 스킬을 선택하세요</h2>
  <p style="color:#999; font-size:12px; margin-top:-14px; margin-bottom:14px;">방향키로 이동, 엔터로 선택</p>
  <div class="cardRow" id="cardRow"></div>
</div>

<div id="gameOverModal">
  <h1>GAME OVER</h1>
  <div id="finalStats" style="margin-top:10px; color:#ccc;"></div>
  <div id="nicknameEntry">
    <input id="nicknameInput" maxlength="10" placeholder="닉네임을 입력하세요" />
    <button id="submitScoreBtn">리더보드 등록</button>
  </div>
  <div id="leaderboardWrap">
    <h3>🏆 리더보드 TOP 20</h3>
    <ol id="leaderboardList"></ol>
    <button id="playAgainBtn">다시 시작</button>
  </div>
</div>

<div id="startModal">
  <h1>🐾 리센느의 백제어택</h1>
  <p>백제 자객의 공격을 피하며 살아남으세요. 공격은 자동으로 나갑니다.
  경험치 구슬을 먹어 레벨업하고, 무기와 능력을 강화해 최대한 오래 버티세요!</p>
  <button id="startBtn">게임 시작</button>
  <button id="viewLeaderboardBtn">🏆 리더보드 보기</button>
</div>

<div id="startLeaderboardModal">
  <h2>🏆 리더보드 TOP 20</h2>
  <ol id="startLeaderboardList"></ol>
  <button id="closeLeaderboardBtn">닫기</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

// ---------- 유틸 ----------
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(min, max) { return Math.random() * (max - min) + min; }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ---------- 장애물(바위/나무) ----------
function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}
const OBSTACLE_CELL = 240;
function getObstacleAt(cx, cy) {
  const h = hash2(cx, cy);
  if (h > 0.13) return null;
  const jx = hash2(cx + 11, cy + 7);
  const jy = hash2(cx + 29, cy + 3);
  const wx = cx * OBSTACLE_CELL + OBSTACLE_CELL * 0.2 + jx * OBSTACLE_CELL * 0.6;
  const wy = cy * OBSTACLE_CELL + OBSTACLE_CELL * 0.2 + jy * OBSTACLE_CELL * 0.6;
  if (Math.hypot(wx, wy) < 200) return null; // 시작 지점 근처는 비워둠
  const isTree = hash2(cx + 5, cy + 91) < 0.55;
  return { x: wx, y: wy, r: isTree ? 30 : 24, icon: isTree ? '🌲' : '🪨', isTree };
}
function getNearbyObstacles(x, y, margin) {
  const list = [];
  const c0x = Math.floor((x - margin) / OBSTACLE_CELL), c1x = Math.floor((x + margin) / OBSTACLE_CELL);
  const c0y = Math.floor((y - margin) / OBSTACLE_CELL), c1y = Math.floor((y + margin) / OBSTACLE_CELL);
  for (let cx = c0x; cx <= c1x; cx++) {
    for (let cy = c0y; cy <= c1y; cy++) {
      const o = getObstacleAt(cx, cy);
      if (o) list.push(o);
    }
  }
  return list;
}
function resolveObstacleCollision(entity) {
  const nearby = getNearbyObstacles(entity.x, entity.y, OBSTACLE_CELL * 1.5);
  for (const o of nearby) {
    const d = dist(entity, o);
    const minD = entity.r + o.r;
    if (d < minD && d > 0.001) {
      const push = minD - d;
      const ang = Math.atan2(entity.y - o.y, entity.x - o.x);
      entity.x += Math.cos(ang) * push;
      entity.y += Math.sin(ang) * push;
    }
  }
}

let sfxEnabled = true;
let bgmEnabled = true;

let audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  return audioCtx;
}

function playBeep(freq, duration, type = 'sine', volume = 0.15) {
  if (!sfxEnabled) return;
  const ctx = ensureAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* ignore */ }
}

let lastHitSoundTime = -999;
function playHitSound() {
  if (gameTime - lastHitSoundTime < 0.06) return;
  lastHitSoundTime = gameTime;
  playBeep(180 + Math.random() * 60, 0.07, 'square', 0.06);
}
function playGemSound() {
  playBeep(880, 0.07, 'sine', 0.1);
}
function playLevelUpSound() {
  playBeep(660, 0.12, 'triangle', 0.18);
  setTimeout(() => playBeep(880, 0.15, 'triangle', 0.18), 90);
  setTimeout(() => playBeep(1100, 0.2, 'triangle', 0.18), 180);
}

// ---------- BGM (유튜브 임베드 플레이어, 재생목록 순환) ----------
const YT_VIDEO_IDS = ['MC6-82GRK5I', 'h0xUtrb_JBc', '9XttLI0oH0I', 'sS-8P_GcTHI', 'ZbO9PBdFRdc', 'c70TkZH7fr0'];
let ytPlayer = null;
let ytReady = false;
let ytPendingPlay = false;

const ytTag = document.createElement('script');
ytTag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytTag);

function pickRandomVideoIndex(excludeIdx) {
  if (YT_VIDEO_IDS.length <= 1) return 0;
  let idx;
  do {
    idx = Math.floor(Math.random() * YT_VIDEO_IDS.length);
  } while (idx === excludeIdx);
  return idx;
}

window.onYouTubeIframeAPIReady = function () {
  ytPlayer = new YT.Player('ytPlayer', {
    height: '90',
    width: '160',
    playerVars: { autoplay: 0, controls: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: (e) => {
        ytReady = true;
        const wrap = document.getElementById('ytPlayerWrap');
        if (wrap) wrap.classList.add('yt-active');
        e.target.setVolume(12); // 효과음과 비슷하거나 작은 수준
        const startIdx = pickRandomVideoIndex(-1);
        e.target.cuePlaylist({ playlist: YT_VIDEO_IDS, index: startIdx });
        if (ytPendingPlay) { e.target.playVideo(); ytPendingPlay = false; }
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) {
          // 곡이 끝나면 랜덤 순서로 다음 곡 재생 (전체 무한 반복)
          const idx = ytPlayer.getPlaylistIndex();
          const next = pickRandomVideoIndex(idx);
          ytPlayer.playVideoAt(next);
        }
      },
      onError: (e) => {
        // 임베드 금지 등으로 재생 불가한 영상은 건너뛰고 랜덤한 다음 곡 재생
        console.warn('유튜브 재생 오류(임베드 제한 가능성), 코드:', e.data, '→ 다음 곡으로 이동');
        const idx = ytPlayer.getPlaylistIndex();
        const next = pickRandomVideoIndex(idx);
        ytPlayer.playVideoAt(next);
      }
    }
  });
};

let joystickPointerId = null;
let joystickCenter = { x: 0, y: 0 };
const JOY_RADIUS = 27;

function isTouchDevice() {
  return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
}
if (isTouchDevice()) {
  touchZone.style.display = 'block';
}

// 모바일 세로형 화면에서만 캐릭터를 더 크게 렌더링 (PC는 영향 없음)

function joystickShowAt(x, y) {
  joystickCenter.x = x; joystickCenter.y = y;
  joystickBase.style.left = x + 'px';
  joystickBase.style.top = y + 'px';
  joystickBase.style.display = 'block';
  joystickKnob.style.left = '27px';
  joystickKnob.style.top = '27px';
}
function joystickSetFromEvent(e) {
  let dx = e.clientX - joystickCenter.x;
  let dy = e.clientY - joystickCenter.y;
  const len = Math.hypot(dx, dy);
  if (len > JOY_RADIUS) {
    dx = (dx / len) * JOY_RADIUS;
    dy = (dy / len) * JOY_RADIUS;
  }
  joystickKnob.style.left = (27 + dx) + 'px';
  joystickKnob.style.top = (27 + dy) + 'px';
  joystickVec.x = dx / JOY_RADIUS;
  joystickVec.y = dy / JOY_RADIUS;
}
function joystickReset() {
  joystickVec.x = 0; joystickVec.y = 0;
  joystickBase.style.display = 'none';
}
touchZone.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch') return;
  // 게임오버/시작/레벨업/룰렛 모달이 열려있을 땐 조이스틱 비활성화
  if (!running) return;
  joystickPointerId = e.pointerId;
  touchZone.setPointerCapture(e.pointerId);
  joystickShowAt(e.clientX, e.clientY);
  joystickSetFromEvent(e);
});
touchZone.addEventListener('pointermove', (e) => {
  if (e.pointerId !== joystickPointerId) return;
  joystickSetFromEvent(e);
});
function joystickEnd(e) {
  if (e.pointerId !== joystickPointerId) return;
  joystickPointerId = null;
  joystickReset();
}
touchZone.addEventListener('pointerup', joystickEnd);
touchZone.addEventListener('pointercancel', joystickEnd);

    e.preventDefault();

  }
});

// ---------- 스폰 ----------
function enemyStatsForTime(t) {
  const tier = Math.min(Math.floor(t / 30), 6);
  const baseSpeed = 60 + tier * 6;
  return {
    hp: 12 + tier * 10,
    speed: baseSpeed * rand(0.7, 1.35), // 개체마다 속도 랜덤 편차
    dmg: 6 + tier * 2,
    r: 12,
    color: `hsl(${0 + tier * 8}, 70%, 50%)`,
    xp: 2 + tier,
  };
}

function spawnEnemy() {
  const angle = rand(0, Math.PI * 2);
  // 모바일에서는 줌아웃된 만큼 실제 보이는 범위가 넓어지므로 스폰 거리도 그만큼 늘려야
  // 화면 바깥쪽(넓어진 시야) 링에도 적이 정상적으로 생성됨
  const zoom = isMobileLayout ? MOBILE_ZOOM : 1;
  const spawnDist = (Math.max(canvas.width, canvas.height) / 2) / zoom + 60;
  const x = player.x + Math.cos(angle) * spawnDist;
  const y = player.y + Math.sin(angle) * spawnDist;
  const s = enemyStatsForTime(gameTime);
  enemies.push({ x, y, ...s, maxHp: s.hp });
}

// 동물 컴패니언은 맵 곳곳에 낮은 확률로 결정론적으로 배치 (해시 기반, 타이머 아님)
const COMPANION_CELL = 480;
function getCompanionAt(cx, cy) {
  const h = hash2(cx * 7 + 3, cy * 13 + 9);
  if (h > 0.03) return null; // 낮은 확률로만 배치
  const jx = hash2(cx + 41, cy + 17);
  const jy = hash2(cx + 17, cy + 41);
  const wx = cx * COMPANION_CELL + COMPANION_CELL * 0.15 + jx * COMPANION_CELL * 0.7;
  const wy = cy * COMPANION_CELL + COMPANION_CELL * 0.15 + jy * COMPANION_CELL * 0.7;
  if (Math.hypot(wx, wy) < 260) return null; // 시작 지점 근처는 비워둠
  const keyIdx = Math.floor(hash2(cx + 3, cy + 91) * ANIMAL_KEYS.length) % ANIMAL_KEYS.length;
  const key = ANIMAL_KEYS[keyIdx];
  return { cellKey: cx + ',' + cy, x: wx, y: wy, r: 18, key };
}
function getNearbyCompanions(x, y, margin) {
  const list = [];
  const c0x = Math.floor((x - margin) / COMPANION_CELL), c1x = Math.floor((x + margin) / COMPANION_CELL);
  const c0y = Math.floor((y - margin) / COMPANION_CELL), c1y = Math.floor((y + margin) / COMPANION_CELL);
  for (let cx = c0x; cx <= c1x; cx++) {
    for (let cy = c0y; cy <= c1y; cy++) {
      const c = getCompanionAt(cx, cy);
      if (c && !triggeredCompanions.has(c.cellKey)) list.push(c);
    }
  }
  return list;
}

// ---------- 업데이트 ----------
function update(dt) {
  gameTime += dt;
  document.getElementById('timeText').textContent =
    String(Math.floor(gameTime / 60)).padStart(2, '0') + ':' +
    String(Math.floor(gameTime % 60)).padStart(2, '0');

  // 플레이어 이동 (키보드 + 모바일 조이스틱)
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (joystickVec.x !== 0 || joystickVec.y !== 0) {
    dx += joystickVec.x;
    dy += joystickVec.y;
  }
  const moveLen = Math.hypot(dx, dy);
  if (moveLen > 0.05) {
    const nx = dx / Math.max(moveLen, 1);
    const ny = dy / Math.max(moveLen, 1);
    const mag = Math.min(1, moveLen);
    player.x += nx * mag * player.speed * dt;
    player.y += ny * mag * player.speed * dt;
    if (dx !== 0) player.facing = dx > 0 ? 1 : -1;
    player.facingUp = dy < 0;
  }
  camera.x = player.x;
  camera.y = player.y;
  if (player.invuln > 0) player.invuln -= dt;
  resolveObstacleCollision(player);
  camera.x = player.x;
  camera.y = player.y;

  // 동물 컴패니언: 맵 곳곳에 배치된 것 중 가까이 간 경우 즉시 효과 발동
  const nearCompanions = getNearbyCompanions(player.x, player.y, COMPANION_CELL * 1.5);
  for (const c of nearCompanions) {
    if (dist(c, player) < c.r + player.r) {
      triggeredCompanions.add(c.cellKey);
      const effectDesc = applyAnimalSkill(c.key);
      floatingTexts.push({
        x: c.x, y: c.y - 22, text: ANIMAL_MESSAGES[c.key],
        life: 1.6, maxLife: 1.6, size: 16, color: '#ffd54f'
      });
      if (effectDesc) {
        floatingTexts.push({
          x: c.x, y: c.y - 2, text: effectDesc,
          life: 1.8, maxLife: 1.8, size: 13, color: '#9be29b'
        });
      }
      spawnParticles(c.x, c.y, '#ffd54f', 10);
      break; // 한 프레임에 하나만 트리거
    }
  }

  // 스폰
  spawnTimer -= dt;
  const spawnInterval = Math.max(0.32, 1.2 - gameTime / 70);
  if (spawnTimer <= 0) {
    spawnTimer = spawnInterval;
    const burst = Math.min(8, 1 + Math.floor(gameTime / 60)); // 버스트 상한 (무한 증가 방지)
    for (let i = 0; i < burst; i++) {
      if (enemies.length >= MAX_ENEMIES) break; // 동시 생존 개체수 상한 (렉 방지)
      spawnEnemy();
    }
  }

  // 적 이동 & 플레이어 충돌
  for (const e of enemies) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    const spd = e.slowTimer > 0 ? e.speed * (e.slowFactor || 1) : e.speed;
    e.x += Math.cos(a) * spd * dt;
    e.y += Math.sin(a) * spd * dt;
    e.facing = Math.cos(a) >= 0 ? 1 : -1;
    e.facingUp = Math.sin(a) < 0;
    if (e.slowTimer > 0) e.slowTimer -= dt;
    resolveObstacleCollision(e);
    if (dist(e, player) < e.r + player.r && player.invuln <= 0 && player.specialInvulnTimer <= 0) {
      const dmg = e.dmg * (1 - player.armor);
      player.hp -= dmg;
      player.invuln = 0.5;
      spawnParticles(player.x, player.y, '#f55', 6);
    }
  }
  if (player.specialInvulnTimer > 0) player.specialInvulnTimer -= dt;

  // 궤도 무기(리센느아세요?) 회전은 발사 여부와 무관하게 매 프레임 갱신
  for (const w of weapons) {
    if (w.type === 'orbit') w.angle = (w.angle || 0) + (w.angularSpeed || 2.4) * dt;
  }

  // 무기 처리
  for (const w of weapons) {
    w.timer -= dt;
    if (w.timer <= 0) {
      w.timer = Math.max(0.08, w.cd * (1 - (player.cdr || 0)));
      fireWeapon(w);
    }
  }

  // 오이쉬에(투척) 진행 및 착탄 처리
  for (const th of throws) {
    th.t += dt;
    if (th.t >= th.duration && !th.landed) {
      th.landed = true;
      for (const e of enemies) {
        if (dist({ x: th.tx, y: th.ty }, e) < th.radius + e.r) {
          e.hp -= th.dmg;
          spawnParticles(e.x, e.y, '#fc5', 3);
        }
      }
      spawnParticles(th.tx, th.ty, '#ffd54f', 12);
      playHitSound();
    }
  }
  throws = throws.filter(th => !th.landed);

  // 총알 업데이트
  for (const b of bullets) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    for (const e of enemies) {
      if (b.hitSet.has(e)) continue;
      if (dist(b, e) < e.r + b.r) {
        e.hp -= b.dmg;
        b.hitSet.add(e);
        b.pierce--;
        spawnParticles(e.x, e.y, '#ff5', 4);
        playHitSound();
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.pierce > 0);

  // 범위형(aoe) 무기 즉시 판정 플래그 초기화
  for (const w of weapons) {
    if (w.type === 'aoe' && w.justFired) {
      w.justFired = false;
    }
  }

  // 적 사망 처리
  for (const e of enemies) {
    if (e.hp <= 0) {
      killCount++;
      spawnParticles(e.x, e.y, e.color, 10);
      gems.push({ x: e.x, y: e.y, xp: Math.round(e.xp * (player.luck || 1)), r: 6 });
    }
  }
  enemies = enemies.filter(e => e.hp > 0);
  document.getElementById('killText').textContent = killCount;

  // 경험치 구슬 자석 + 흡수
  for (const g of gems) {
    const d = dist(g, player);
    if (d < player.magnetRange) {
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      const pull = 500 * dt;
      g.x += Math.cos(a) * pull;
      g.y += Math.sin(a) * pull;
    }
    if (d < player.r + g.r) {
      xp += g.xp;
      g.dead = true;
      playGemSound();
    }
  }
  gems = gems.filter(g => !g.dead);

  // 레벨업 체크
  if (xp >= xpToNext) {
    xp -= xpToNext;
    level++;
    xpToNext = Math.floor(xpToNext * 1.25 + 5);
    document.getElementById('levelText').textContent = 'Lv.' + level;
    playLevelUpSound();
    openLevelUp();
  }

  // 파티클
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // 에디슨젓가락 스와이프 이펙트
  for (const f of chopstickFx) f.life -= dt;
  chopstickFx = chopstickFx.filter(f => f.life > 0);

  // aoe 발동 펄스 이펙트
  for (const f of aoeFx) f.life -= dt;
  aoeFx = aoeFx.filter(f => f.life > 0);

  // 컴패니언 플로팅 텍스트
  for (const ft of floatingTexts) { ft.y -= 22 * dt; ft.life -= dt; }
  floatingTexts = floatingTexts.filter(ft => ft.life > 0);

  // UI 갱신
  document.getElementById('hpBar').style.width = Math.max(0, player.hp / player.maxHp * 100) + '%';
  document.getElementById('xpBar').style.width = Math.max(0, xp / xpToNext * 100) + '%';

  if (player.hp <= 0) endGame();
}

function fireWeapon(w) {
  const dmg = w.dmg * (player.dmgMult || 1);

  if (w.type === 'chase') {
    // 우이: 가장 가까운 적에게 화염 발사
    let nearest = null, nd = Infinity;
    for (const e of enemies) {
      const d = dist(e, player);
      if (d < nd) { nd = d; nearest = e; }
    }
    if (!nearest) return;
    for (let i = 0; i < w.count; i++) {
      const a = Math.atan2(nearest.y - player.y, nearest.x - player.x) + (i - (w.count - 1) / 2) * 0.25;
      bullets.push({
        x: player.x, y: player.y, r: 6,
        vx: Math.cos(a) * w.speed, vy: Math.sin(a) * w.speed,
        dmg, life: 2, pierce: w.pierce, hitSet: new Set(), color: '#ff7043', icon: '🔥'
      });
    }

  } else if (w.type === 'aoe') {
    if (w.key === 'chopstick') {
      // 에디슨젓가락: 샷건처럼 근접 부채꼴 범위 다수 공격 + 피격 시 넉백
      let aimAngle;
      let nearest = null, nd = Infinity;
      for (const e of enemies) {
        const d = dist(e, player);
        if (d < nd) { nd = d; nearest = e; }
      }
      if (nearest) {
        aimAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
      } else {
        aimAngle = (player.facing || 1) > 0 ? 0 : Math.PI;
      }
      const coneHalf = Math.PI / 3.2; // 부채꼴 절반각(약 56도, 총 약 112도)
      let hitAny = false;
      for (const e of enemies) {
        const d = dist(e, player);
        if (d >= w.range) continue;
        const angToE = Math.atan2(e.y - player.y, e.x - player.x);
        let diff = Math.abs(angToE - aimAngle);
        if (diff > Math.PI) diff = Math.PI * 2 - diff;
        if (diff <= coneHalf) {
          e.hp -= dmg;
          spawnParticles(e.x, e.y, '#fc5', 3);
          hitAny = true;
          const push = 18; // 샷건형이라 그만좀봅시다보다 넉백을 좀 더 세게
          e.x += Math.cos(angToE) * push;
          e.y += Math.sin(angToE) * push;
        }
      }
      if (hitAny) playHitSound();
      w.justFired = true;

      // 부채꼴 범위 내에서 스와이프(휘두르기)하는 이펙트
      chopstickFx.push({
        x: player.x, y: player.y,
        startAngle: aimAngle - coneHalf,
        endAngle: aimAngle + coneHalf,
        radius: w.range,
        life: 0.22, maxLife: 0.22
      });
    } else {
      // 그만 좀 봅시다: 범위 즉시 피해+밀치기, 거제의 딸: 피해 없이 슬로우
      const range = w.range;
      let hitAny = false;
      for (const e of enemies) {
        if (dist(e, player) < range) {
          if (w.key === 'geojedaughter') {
            e.slowTimer = 1.2;
            e.slowFactor = 0.45;
            spawnParticles(e.x, e.y, '#90caf9', 2);
          } else {
            e.hp -= dmg;
            spawnParticles(e.x, e.y, '#fc5', 3);
            hitAny = true;
            if (w.knockback) {
              const a = Math.atan2(e.y - player.y, e.x - player.x);
              e.x += Math.cos(a) * 10;
              e.y += Math.sin(a) * 10;
            }
          }
        }
      }
      if (hitAny) playHitSound();
      w.justFired = true;

      // 발동 순간에만 잠깐 나타나는 펄스 링
      let pulseColor = 'rgba(255,255,255,0.5)';
      if (w.key === 'geojedaughter') pulseColor = 'rgba(255,182,193,0.6)';
      else if (w.key === 'stopit') pulseColor = 'rgba(200,255,120,0.6)';
      aoeFx.push({ x: player.x, y: player.y, radius: range, life: 0.18, maxLife: 0.18, color: pulseColor });
    }

  } else if (w.type === 'throw') {
    // 오이쉬에: 엄지를 던져 포물선 광역 피해
    const inRange = enemies.filter(e => dist(e, player) < w.throwRange);
    let tx, ty;
    if (inRange.length) {
      const t = choice(inRange);
      tx = t.x; ty = t.y;
    } else {
      const a = rand(0, Math.PI * 2);
      tx = player.x + Math.cos(a) * w.throwRange * 0.6;
      ty = player.y + Math.sin(a) * w.throwRange * 0.6;
    }
    throws.push({
      x0: player.x, y0: player.y, tx, ty, t: 0, duration: w.flightTime,
      dmg, radius: w.radius, icon: '👍', landed: false
    });

  } else if (w.type === 'orbit') {
    // 리센느아세요?: CD가 주위를 돌며 타격, 최대 5개
    const count = Math.min(w.level, 5);
    let orbitHit = false;
    for (let i = 0; i < count; i++) {
      const ang = (w.angle || 0) + (i * Math.PI * 2) / count;
      const sx = player.x + Math.cos(ang) * w.orbitRadius;
      const sy = player.y + Math.sin(ang) * w.orbitRadius;
      for (const e of enemies) {
        if (dist({ x: sx, y: sy }, e) < w.hitRadius + e.r) {
          e.hp -= dmg;
          spawnParticles(e.x, e.y, '#b39ddb', 2);
          orbitHit = true;
        }
      }
    }
    if (orbitHit) playHitSound();
  }
}

const MAX_PARTICLES = 260;
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift(); // 상한 초과 시 오래된 것부터 제거
    const a = rand(0, Math.PI * 2);
    const spd = rand(30, 120);
    particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life: rand(0.2, 0.5), color });
  }
}

// ---------- 레벨업 카드 ----------
function openLevelUp() {
  running = false;
  const modal = document.getElementById('levelUpModal');
  const row = document.getElementById('cardRow');
  row.innerHTML = '';

  const options = [];
  // 보유 무기 강화 옵션 (이미 획득한 스킬이라 약간 더 자주 나오도록 가중치 부여 - 기존 대비 절반 수준)
  for (const w of weapons) {
    if (w.level < 5) {
      options.push({ type: 'upgrade', weapon: w });
      if (Math.random() < 0.5) options.push({ type: 'upgrade', weapon: w }); // 재등장 확률 소폭 상향(기존의 절반)
    }
  }
  // 신규 무기
  for (const wp of WEAPON_POOL) {
    if (!weapons.find(w => w.key === wp.key) && weapons.length < 6) {
      options.push({ type: 'new', base: wp });
    }
  }
  // 패시브
  for (const pp of PASSIVE_POOL) {
    options.push({ type: 'passive', base: pp });
  }

  const picks = [];
  const pool = [...options];
  while (picks.length < 3 && pool.length) {
    const idx = Math.floor(Math.random() * pool.length);
    picks.push(pool.splice(idx, 1)[0]);
  }

  const cardEls = [];
  for (const opt of picks) {
    const card = document.createElement('div');
    card.className = 'card';
    let icon, name, desc;
    if (opt.type === 'upgrade') {
      icon = WEAPON_POOL.find(w => w.key === opt.weapon.key).icon;
      name = WEAPON_POOL.find(w => w.key === opt.weapon.key).name + ' Lv.' + (opt.weapon.level + 1);
      desc = '피해량 및 성능 강화';
    } else if (opt.type === 'new') {
      icon = opt.base.icon; name = opt.base.name + ' (신규)'; desc = opt.base.desc;
    } else {
      icon = opt.base.icon; name = opt.base.name; desc = opt.base.desc;
    }
    card.innerHTML = `<div class="icon">${icon}</div><div class="textWrap"><div class="name">${name}</div><div class="desc">${desc}</div></div>`;
    card.onclick = () => { applyChoice(opt); closeLevelUp(); };
    row.appendChild(card);
    cardEls.push(card);
  }
  modal.style.display = 'flex';

  // 키보드(방향키+엔터) 탐색 설정
  levelUpChoices = picks;
  levelUpCardEls = cardEls;
  levelUpSelectedIndex = 0;
  updateLevelUpSelection();
}

function updateLevelUpSelection() {
  levelUpCardEls.forEach((el, i) => {
    el.classList.toggle('selected', i === levelUpSelectedIndex);
  });
}

// ---------- 동물 컴패니언 룰렛 ----------
function applyAnimalSkill(key) {
  if (key === 'elephant') {
    const count = enemies.length;
    for (const e of enemies) spawnParticles(e.x, e.y, '#ffd54f', 6);
    enemies = [];
    return `백제자객 ${count}명 제거!`;
  } else if (key === 'sheep') {
    let gained = 0;
    for (const g of gems) { xp += g.xp; gained += g.xp; }
    gems = [];
    while (xp >= xpToNext) {
      xp -= xpToNext;
      level++;
      xpToNext = Math.floor(xpToNext * 1.25 + 5);
      document.getElementById('levelText').textContent = 'Lv.' + level;
    }
    return `경험치 ${gained} 획득!`;
  } else if (key === 'seal') {
    const pickCount = 1 + Math.floor(Math.random() * 3); // 1~3개
    const labels = [];
    for (let i = 0; i < pickCount; i++) {
      const pool = [];
      for (const w of weapons) if (w.level < 5) pool.push({ type: 'upgrade', weapon: w });
      for (const wp of WEAPON_POOL) if (!weapons.find(w => w.key === wp.key) && weapons.length < 6) pool.push({ type: 'new', base: wp });
      for (const pp of PASSIVE_POOL) pool.push({ type: 'passive', base: pp });
      if (!pool.length) break;
      const opt = choice(pool);
      applyChoice(opt);
      if (opt.type === 'upgrade') labels.push(WEAPON_POOL.find(w => w.key === opt.weapon.key).name + ' 강화');
      else if (opt.type === 'new') labels.push(opt.base.name + ' 획득');
      else labels.push(opt.base.name + ' 획득');
    }
    return labels.length ? labels.join(' / ') : '획득 가능한 스킬 없음';
  } else if (key === 'bear') {
    player.specialInvulnTimer = 10;
    return '10초 무적 + 황금빛 변신!';
  }
  return '';
}

function applyChoice(opt) {
  if (opt.type === 'upgrade') {
    const w = opt.weapon;
    w.level++;
    w.dmg = Math.round(w.dmg * 1.35 * 10) / 10;
    if (w.cd) w.cd = Math.max(0.1, w.cd * 0.88);
    if (w.count) w.count++;
    if (w.range) w.range *= 1.16;
    if (w.radius) w.radius *= 1.16;
    if (w.orbitRadius) w.orbitRadius *= 1.08;
  } else if (opt.type === 'new') {
    weapons.push({ ...opt.base, level: 1, timer: 0, angle: 0 });
  } else if (opt.type === 'passive') {
    switch (opt.base.key) {
      case 'speed': player.speed *= 1.15; break;
      case 'maxhp': player.maxHp += 20; player.hp += 20; break;
      case 'armor': player.armor = Math.min(0.6, player.armor + 0.1); break;
      case 'magnet': player.magnetRange *= 1.4; break;
      case 'cdr': player.cdr = Math.min(0.5, (player.cdr || 0) + 0.08); break;
      case 'dmgup': player.dmgMult = (player.dmgMult || 1) + 0.05; break;
      case 'luck': player.luck = (player.luck || 1) + 0.2; break;
    }
  }
}

function closeLevelUp() {
  document.getElementById('levelUpModal').style.display = 'none';
  levelUpCardEls = [];
  levelUpChoices = [];
  running = true;
  lastTs = performance.now();
  requestAnimationFrame(loop);
}

// ---------- 렌더 ----------
function render() {
  ctx.fillStyle = '#5a4632';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  if (isMobileLayout) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(MOBILE_ZOOM, MOBILE_ZOOM);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);
  }

  const ox = canvas.width / 2 - camera.x;
  const oy = canvas.height / 2 - camera.y;

  // 모바일에서는 줌아웃된 만큼 실제로 보이는 월드 범위가 넓어지므로, 그 배율을 반영해야 함
  const viewZoom = isMobileLayout ? MOBILE_ZOOM : 1;
  const viewHalfW = (canvas.width / 2) / viewZoom;
  const viewHalfH = (canvas.height / 2) / viewZoom;

  // 흙바닥 텍스처 (월드 좌표 기반 결정론적 얼룩 패턴)
  const cell = 46;
  const c0x = Math.floor((camera.x - viewHalfW) / cell) - 1;
  const c1x = Math.floor((camera.x + viewHalfW) / cell) + 1;
  const c0y = Math.floor((camera.y - viewHalfH) / cell) - 1;
  const c1y = Math.floor((camera.y + viewHalfH) / cell) + 1;
  for (let cx = c0x; cx <= c1x; cx++) {
    for (let cy = c0y; cy <= c1y; cy++) {
      const h1 = hash2(cx, cy);
      const wx = cx * cell + hash2(cx + 3, cy + 8) * cell;
      const wy = cy * cell + hash2(cx + 8, cy + 3) * cell;
      const sx = wx + ox, sy = wy + oy;
      // 컷오프 조건도 줌 배율이 반영된 실제 가시 범위(화면 중심 ± viewHalf) 기준이어야 함
      const cxScreenCenter = canvas.width / 2;
      const cyScreenCenter = canvas.height / 2;
      if (sx < cxScreenCenter - viewHalfW - 30 || sx > cxScreenCenter + viewHalfW + 30 ||
          sy < cyScreenCenter - viewHalfH - 30 || sy > cyScreenCenter + viewHalfH + 30) continue;
      if (h1 < 0.34) {
        // 어두운 흙덩이
        ctx.fillStyle = `rgba(60,46,30,${0.25 + h1 * 0.4})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy, 10 + h1 * 10, 7 + h1 * 6, h1 * 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (h1 > 0.85) {
        // 밝은 자갈/풀 포인트
        ctx.fillStyle = `rgba(140,120,80,${0.3 + (h1 - 0.85) * 2})`;
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (h1 > 0.7) {
        ctx.fillStyle = 'rgba(90,110,50,0.25)';
        ctx.beginPath();
        ctx.arc(sx, sy, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // 장애물(바위/나무) 렌더링
  const obsMargin = Math.max(viewHalfW, viewHalfH) + 80;
  for (const o of getNearbyObstacles(camera.x, camera.y, obsMargin)) {
    const sx = o.x + ox, sy = o.y + oy;
    ctx.beginPath();
    ctx.ellipse(sx, sy + o.r * 0.7, o.r * 0.9, o.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fill();
    ctx.font = (o.r * 2) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(o.icon, sx, sy);
  }

  // 동물 컴패니언 렌더링 (맵 곳곳에 배치, 둥실거리는 모션)
  for (const c of getNearbyCompanions(camera.x, camera.y, obsMargin)) {
    const info = ANIMAL_INFO[c.key];
    const img = info.img();
    const bob = Math.sin(gameTime * 2.4 + c.x * 0.01 + c.y * 0.01) * 5;
    const ch = c.r * 3.2;
    const cw = ch * info.ratio;
    const sx = c.x + ox, sy = c.y + oy + bob;
    // 은은한 발광
    ctx.beginPath();
    ctx.arc(sx, sy + ch * 0.25, ch * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,213,79,0.18)';
    ctx.fill();
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, sx - cw / 2, sy - ch / 2, cw, ch);
    }
  }

  // 범위형(aoe) 무기 발동 펄스 이펙트 (상시 원이 아닌 발동 순간만 표시)
  for (const f of aoeFx) {
    const p = f.life / f.maxLife;
    ctx.beginPath();
    ctx.arc(player.x + ox, player.y + oy, f.radius * (1.05 - p * 0.15), 0, Math.PI * 2);
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 3;
    ctx.globalAlpha = p;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 궤도 무기(리센느아세요?) 표시
  for (const w of weapons) {
    if (w.type === 'orbit') {
      const count = Math.min(w.level, 5);
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (let i = 0; i < count; i++) {
        const ang = (w.angle || 0) + (i * Math.PI * 2) / count;
        const sx = player.x + Math.cos(ang) * w.orbitRadius + ox;
        const sy = player.y + Math.sin(ang) * w.orbitRadius + oy;
        ctx.fillText(w.icon, sx, sy);
      }
    }
  }

  // 에디슨젓가락 스와이프 이펙트 (부채꼴 범위 내를 휘두르는 궤적 + 젓가락 아이콘)
  for (const f of chopstickFx) {
    const p = Math.min(1, (1 - f.life / f.maxLife) * 1.3);
    const curAngle = f.startAngle + (f.endAngle - f.startAngle) * p;
    const alpha = Math.max(0, f.life / f.maxLife);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(f.x + ox, f.y + oy);
    ctx.arc(f.x + ox, f.y + oy, f.radius, f.startAngle, curAngle, false);
    ctx.closePath();
    ctx.fillStyle = 'rgba(255,220,120,0.22)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,120,0.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    // 부채꼴을 스와이프하는 젓가락 한짝 (직접 그린 막대 형태)
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(f.x + ox, f.y + oy);
    ctx.rotate(curAngle);
    const stickLen = f.radius * 0.95;
    const stickW = 7;
    const grad = ctx.createLinearGradient(0, 0, stickLen, 0);
    grad.addColorStop(0, '#f3ddb0');
    grad.addColorStop(1, '#c9a06a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(0, -stickW / 2, stickLen, stickW, stickW / 2);
    } else {
      ctx.rect(0, -stickW / 2, stickLen, stickW);
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,90,50,0.6)';
    ctx.lineWidth = 1;
    ctx.stroke();
    // 뾰족한 끝
    ctx.beginPath();
    ctx.moveTo(stickLen, -stickW / 2);
    ctx.lineTo(stickLen + 9, 0);
    ctx.lineTo(stickLen, stickW / 2);
    ctx.closePath();
    ctx.fillStyle = '#c9a06a';
    ctx.fill();
    ctx.restore();
  }

  // 오이쉬에(투척) 표시 - 이모지 대신 직접 그린 엄지척 도형 (기기별 이모지 폰트 렌더링 문제 회피)
  for (const th of throws) {
    const p = Math.min(1, th.t / th.duration);
    const x = th.x0 + (th.tx - th.x0) * p;
    const y = th.y0 + (th.ty - th.y0) * p;
    const height = Math.sin(p * Math.PI) * 60;
    const size = 20 + height * 0.15;
    const sx = x + ox, sy = y + oy - height;
    const spin = p * Math.PI * 3; // 날아가는 동안 빙글빙글 회전

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(spin);
    ctx.fillStyle = '#f2b46d';
    ctx.strokeStyle = '#c9873f';
    ctx.lineWidth = 1.5;
    // 주먹 부분
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(-size * 0.32, -size * 0.12, size * 0.64, size * 0.46, size * 0.14);
    } else {
      ctx.rect(-size * 0.32, -size * 0.12, size * 0.64, size * 0.46);
    }
    ctx.fill();
    ctx.stroke();
    // 엄지 부분
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(-size * 0.1, -size * 0.5, size * 0.2, size * 0.42, size * 0.1);
    } else {
      ctx.rect(-size * 0.1, -size * 0.5, size * 0.2, size * 0.42);
    }
    ctx.fill();
    ctx.stroke();
    ctx.restore();

    if (p > 0.6) {
      ctx.beginPath();
      ctx.arc(th.tx + ox, th.ty + oy, th.radius * Math.min(1, (p - 0.6) / 0.4), 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,213,79,0.35)';
      ctx.stroke();
    }
  }

  // 경험치 구슬
  for (const g of gems) {
    ctx.beginPath();
    ctx.arc(g.x + ox, g.y + oy, g.r, 0, Math.PI * 2);
    ctx.fillStyle = '#3cf';
    ctx.fill();
  }

  // 총알
  for (const b of bullets) {
    if (b.icon) {
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.icon, b.x + ox, b.y + oy);
    } else {
      ctx.beginPath();
      ctx.arc(b.x + ox, b.y + oy, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color;
      ctx.fill();
    }
  }

  // 적 (화면 밖 개체는 그리기만 생략 - 이동/충돌 로직은 그대로 유지)
  const enemyCullMargin = 60;
  for (const e of enemies) {
    const ex = e.x + ox, ey = e.y + oy;
    if (ex < -enemyCullMargin || ex > canvas.width + enemyCullMargin ||
        ey < -enemyCullMargin || ey > canvas.height + enemyCullMargin) continue;

    const eh = e.r * 3.3 * (isMobileLayout ? MOBILE_CHAR_SCALE : 1);
    const curImg = e.facingUp ? enemyBackImg : enemyImg;
    const curRatio = e.facingUp ? ENEMY_BACK_IMG_RATIO : ENEMY_IMG_RATIO;
    const ew = eh * curRatio;
    if (curImg.complete && curImg.naturalWidth) {
      ctx.save();
      ctx.translate(ex, ey);
      ctx.scale(e.facing || 1, 1);
      ctx.drawImage(curImg, -ew / 2, -eh / 2 + eh * 0.08, ew, eh);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(ex, ey, e.r, 0, Math.PI * 2);
      ctx.fillStyle = e.color;
      ctx.fill();
    }
    // hp bar
    ctx.fillStyle = '#000';
    ctx.fillRect(ex - 14, ey - eh / 2 - 8, 28, 4);
    ctx.fillStyle = '#5f5';
    ctx.fillRect(ex - 14, ey - eh / 2 - 8, 28 * (e.hp / e.maxHp), 4);
  }

  // 파티클
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life * 2);
    ctx.beginPath();
    ctx.arc(p.x + ox, p.y + oy, 3, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 컴패니언 플로팅 텍스트
  for (const ft of floatingTexts) {
    const alpha = Math.max(0, ft.life / ft.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${ft.size || 16}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(ft.text, ft.x + ox + 1, ft.y + oy + 1);
    ctx.fillStyle = ft.color || '#ffd54f';
    ctx.fillText(ft.text, ft.x + ox, ft.y + oy);
    ctx.restore();
  }


  {
    const ph = player.r * 2.8 * (isMobileLayout ? MOBILE_CHAR_SCALE : 1);
    const curImg = player.facingUp ? playerBackImg : playerImg;
    const curRatio = player.facingUp ? PLAYER_BACK_IMG_RATIO : PLAYER_IMG_RATIO;
    const pw = ph * curRatio;
    const px = player.x + ox, py = player.y + oy;
    if (curImg.complete && curImg.naturalWidth) {
      ctx.save();
      if (player.invuln > 0 && Math.floor(gameTime * 20) % 2 === 0) {
        ctx.globalAlpha = 0.4;
      }
      ctx.translate(px, py);
      ctx.scale(player.facing || 1, 1);
      ctx.drawImage(curImg, -pw / 2, -ph / 2 + ph * 0.06, pw, ph);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else {
      ctx.beginPath();
      ctx.arc(px, py, player.r, 0, Math.PI * 2);
      ctx.fillStyle = player.invuln > 0 ? '#fff' : '#ffd54f';
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ---------- 루프 ----------
function loop(ts) {
  if (!running) return;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  update(dt);
  render();
  if (running) requestAnimationFrame(loop);
}

function computeScore() {
  return Math.floor(gameTime) * 2 + killCount * 10 + level * 25;
}

let lastScore = 0;
function endGame() {
  running = false;
  lastScore = computeScore();
  document.getElementById('finalStats').innerHTML =
    `생존 시간: ${document.getElementById('timeText').textContent}<br>` +
    `도달 레벨: Lv.${level}<br>` +
    `처치 수: ${killCount}<br>` +
    `점수: ${lastScore}`;
  document.getElementById('nicknameEntry').style.display = 'flex';
  document.getElementById('leaderboardWrap').style.display = 'none';
  document.getElementById('nicknameInput').value = '';
  document.getElementById('gameOverModal').style.display = 'flex';
}

// ---------- 리더보드 (Firestore 연동, module 스크립트의 window.fb* 함수 사용) ----------
async function renderLeaderboard(highlightEntry, targetId) {
  const listEl = document.getElementById(targetId || 'leaderboardList');
  listEl.innerHTML = '<li style="justify-content:center; color:#666;">불러오는 중...</li>';
  if (!window.fbLoadTop20) {
    listEl.innerHTML = '<li style="justify-content:center; color:#e33;">리더보드 연결 실패</li>';
    return;
  }
  const list = await window.fbLoadTop20();
  listEl.innerHTML = '';
  if (!list.length) {
    listEl.innerHTML = '<li style="justify-content:center; color:#666;">아직 기록이 없어요</li>';
    return;
  }
  list.forEach((entry, i) => {
    const li = document.createElement('li');
    if (highlightEntry && entry.name === highlightEntry.name &&
        entry.score === highlightEntry.score && entry.time === highlightEntry.time) {
      li.className = 'me';
    }
    li.innerHTML = `<span class="rank">${i + 1}위</span><span class="lname">${entry.name}</span><span class="lscore">${entry.score}</span>`;
    listEl.appendChild(li);
  });
}
async function submitScore() {
  const nameInput = document.getElementById('nicknameInput');
  let name = nameInput.value.trim();
  if (!name) name = '익명의 리센느';
  name = name.slice(0, 10);
  const btn = document.getElementById('submitScoreBtn');
  btn.disabled = true;
  btn.textContent = '등록 중...';
  const entry = { name, score: lastScore, level, kills: killCount, time: Math.floor(gameTime) };
  const ok = window.fbSubmitScore ? await window.fbSubmitScore(entry) : false;
  btn.disabled = false;
  btn.textContent = '리더보드 등록';
  document.getElementById('nicknameEntry').style.display = 'none';
  document.getElementById('leaderboardWrap').style.display = 'block';
  if (!ok) {
    document.getElementById('leaderboardList').innerHTML =
      '<li style="justify-content:center; color:#e33;">등록 실패 (네트워크/설정을 확인해주세요)</li>';
    return;
  }
  await renderLeaderboard(entry, 'leaderboardList');
}
document.getElementById('submitScoreBtn').onclick = submitScore;
document.getElementById('nicknameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitScore();
});
document.getElementById('playAgainBtn').onclick = initGame;

// 시작 화면에서 리더보드 조회
document.getElementById('viewLeaderboardBtn').onclick = () => {
  document.getElementById('startLeaderboardModal').style.display = 'flex';
  renderLeaderboard(null, 'startLeaderboardList');
};
document.getElementById('closeLeaderboardBtn').onclick = () => {
  document.getElementById('startLeaderboardModal').style.display = 'none';
};

document.getElementById('startBtn').onclick = () => { startBgm(); initGame(); };
</script>

      const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(20));
      const snap = await getDocs(q);
      const list = [];
      snap.forEach(d => list.push(d.data()));
      return list;
    } catch (e) {
      console.error("리더보드 조회 실패:", e);
      return [];
    }
  };
